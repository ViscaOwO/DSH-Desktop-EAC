name: Minimal core CI

on:
  # 触发策略：push 到 dev/main、PR 到 dev/main、手动 workflow_dispatch。
  # 平台策略：当前只跑 Windows x64 单平台（v6.0.0 release notes 明写 Linux 暂缓）。
  #
  # 恢复多平台矩阵时必须同步的形状断言（它是「矩阵跑哪几个平台」的唯一锁）：
  #   dsh-desktop/test/ci-workflow.test.ts —— assert.equal(..., 1) 只允许一个平台条目
  #
  # 安装包打包 workflow（staged-runtime-artifact.yml）当前是**孤儿**：它只有
  # workflow_call 触发，本文件未提供 packages job 调用它；且它自身仍是 4 平台矩阵。
  # 要接线需：新增 packages job（needs 三个 job + uses 它），并同步
  #   dsh-desktop/test/rpm-packaging.test.ts（锁死其 Linux 条目）与
  #   README.md / README.en.md / docs/README-MAINTENANCE.md 里的构建矩阵表述。
  push:
    branches:
      - dev
      - main
    paths:
      # 每条都对应「改了就影响 CI 结果」的真实输入，勿凭直觉增删。
      - 'dsh-desktop/**'
      - 'tauri-shell/**'
      - '.sync/**'                    # 门禁 plugin-sync validate 的输入账本
      - '.agents/skills/**'           # Skill 的 validate-skill.ps1 校验本处路径覆盖
      - 'docs/**'                     # 门禁/测试直接读取：docs/schemas/**、
                                      # docs/adr/0010-*.md、docs/archive/upgrade-test-441.js
      - '.github/workflows/ci.yml'
      - '.github/workflows/staged-runtime-artifact.yml'
      - '.gitattributes'              # 决定 treeSha256 的换行归一化语义
      - '.gitmodules'                 # submodule 定义
      - 'third_party/dsh-dpx'         # submodule 指针变更（pin 门禁与隔离测试的输入）
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

# GITHUB_TOKEN 最小权限：本 workflow 只读仓库（CodeQL actions/missing-workflow-permissions）。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.7.0'
  KERNEL_VERSION: '0.2.0-rc.2'

jobs:
  source-and-unit:
    name: Node source and unit tests (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x64
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # dsh-dpx 是安装环境隔离的唯一实现（ADR 0004，固定提交）。
          # 不取 submodule 会让隔离测试整片 skip 成「假绿」。
          submodules: recursive

      - name: Verify native runner architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('expected ${{ matrix.arch }}, got ' + process.arch)"

      - name: Verify dsh-dpx submodule pin
        working-directory: ${{ github.workspace }}
        run: node tauri-shell/check-dpx-pin.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} && pnpm --version

      - name: Cache vendored kernel
        uses: actions/cache@v4
        with:
          path: dsh-desktop/vendor/kernel
          key: ${{ runner.os }}-${{ matrix.arch }}-kernel-${{ env.KERNEL_VERSION }}-${{ hashFiles('dsh-desktop/scripts/fetch-kernel.ts') }}

      - name: Prepare vendored kernel
        run: node scripts/fetch-kernel.js

      - name: Install dependencies
        run: npm run ci:install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 账本门禁（ISO-004）：随包实物 ↔ SOURCES.json ↔ .sync 分发账本/历史账本
      # 的一致性不再静默 —— 任一悬空 path、假 bundled 声明、历史行缺失或
      # lock/注册表漂移都在这里红灯（工作目录 = dsh-desktop，路径自解析）。
      - name: Plugin source ledger (SOURCES.json ↔ 实物)
        run: node scripts/plugin-ledger.mjs

      - name: Plugin sync ledger (manifest / distribution / lock / registry)
        run: node scripts/plugin-sync.mjs validate

      - name: Run unit and contract tests
        run: npm test

      - name: Check manifest drift
        working-directory: ${{ github.workspace }}
        run: node dsh-desktop/scripts/check-manifest-drift.mjs

      - name: Upload generated Rust build input
        uses: actions/upload-artifact@v4
        with:
          name: generated-bridge-${{ matrix.os }}-${{ matrix.arch }}
          path: tauri-shell/sidecar/bridge.js
          if-no-files-found: error
          retention-days: 1

  rust-shell:
    name: Rust shell (${{ matrix.os }}/${{ matrix.arch }})
    needs: source-and-unit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 下方「Prepare Tauri resource directory for Rust tests」要读
          # third_party/dsh-dpx/src/*.js；不取 submodule 会在全新检出上 ENOENT。
          submodules: recursive

      - name: Verify native runner architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('expected ${{ matrix.arch }}, got ' + process.arch)"

      - name: Verify dsh-dpx submodule pin
        working-directory: ${{ github.workspace }}
        run: node tauri-shell/check-dpx-pin.mjs

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download generated Rust build input
        uses: actions/download-artifact@v4
        with:
          name: generated-bridge-${{ matrix.os }}-${{ matrix.arch }}
          path: tauri-shell/sidecar

      - name: Prepare Tauri resource directory for Rust tests
        working-directory: ${{ github.workspace }}
        run: node -e "const fs=require('node:fs'); const root='tauri-shell'; const staged=root+'/staged-resources'; fs.mkdirSync(staged+'/sidecar',{recursive:true}); fs.mkdirSync(staged+'/dsh-desktop',{recursive:true}); fs.copyFileSync(root+'/sidecar/bridge.js',staged+'/sidecar/bridge.js'); fs.cpSync(root+'/artifacts',staged+'/ui-skin-manager',{recursive:true}); fs.copyFileSync(root+'/skin-manager-artifact.lock.json',staged+'/ui-skin-manager/artifact.lock.json'); fs.mkdirSync(staged+'/dpx/src',{recursive:true}); for (const f of ['index.js','desktop-release.js','environment-guide.js','http.js']) fs.copyFileSync('third_party/dsh-dpx/src/'+f, staged+'/dpx/src/'+f); fs.copyFileSync('third_party/dsh-dpx/package.json', staged+'/dpx/package.json'); fs.writeFileSync(staged+'/dpx/LICENSE','dsh-dpx - MIT License\n')"

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Fetch Windows Cargo dependencies
        if: runner.os == 'Windows'
        working-directory: tauri-shell
        run: cargo fetch --locked

      - name: Prepare Windows WebView2Loader resource
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: node tauri-shell/prepare-webview2-loader.mjs --arch=${{ matrix.arch }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-shell -> target
          key: ${{ matrix.os }}-${{ matrix.arch }}-minimal-core

      - name: Check formatting
        working-directory: tauri-shell
        run: cargo fmt -- --check

      - name: Run Rust tests
        working-directory: tauri-shell
        run: cargo test --locked

      - name: Check Rust shell
        working-directory: tauri-shell
        run: cargo check --locked

  staged-runtime:
    name: Staged runtime and isolated boot smoke (${{ matrix.os }}/${{ matrix.arch }})
    needs: source-and-unit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x64
            target: win32
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # dsh-dpx 是安装环境隔离的唯一实现（ADR 0004，固定提交）。
          # 不取 submodule 会让隔离测试整片 skip 成「假绿」。
          submodules: recursive

      - name: Verify native runner architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('expected ${{ matrix.arch }}, got ' + process.arch)"

      - name: Verify dsh-dpx submodule pin
        working-directory: ${{ github.workspace }}
        run: node tauri-shell/check-dpx-pin.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} && pnpm --version

      - name: Cache vendored kernel
        uses: actions/cache@v4
        with:
          path: dsh-desktop/vendor/kernel
          key: ${{ runner.os }}-${{ matrix.arch }}-kernel-${{ env.KERNEL_VERSION }}-${{ hashFiles('dsh-desktop/scripts/fetch-kernel.ts') }}

      - name: Prepare vendored kernel
        run: node scripts/fetch-kernel.js

      - name: Install dependencies
        run: npm run ci:install

      - name: Fetch bundled Node and npm runtimes
        run: npm run fetch-runtime

      - name: Set up stable Rust for Windows resources
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch Windows Cargo dependencies
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/tauri-shell
        run: cargo fetch --locked

      - name: Assemble staged runtime
        working-directory: ${{ github.workspace }}
        run: node tauri-shell/stage-resources.mjs --target=${{ matrix.target }} --skip-npm

      - name: Verify staged closure and bundle integrity
        working-directory: ${{ github.workspace }}
        run: node dsh-desktop/scripts/verify-staged-runtime.mjs

      - name: Run isolated minimal boot smoke
        working-directory: ${{ github.workspace }}
        run: node dsh-desktop/scripts/minimal-boot-smoke.mjs

      - name: Check manifest drift
        working-directory: ${{ github.workspace }}
        run: node dsh-desktop/scripts/check-manifest-drift.mjs
